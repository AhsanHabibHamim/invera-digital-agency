# Render Blueprint — Invera Digital Agency API
# Deploys the Express backend as a Node web service.
services:
  - type: web
    name: invera-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in dashboard (contains credentials)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Invera Digital Agency <noreply@inveradigitalagency.com>
      - key: BRAND_NAME
        value: Invera Digital Agency
      - key: GROQ_API_KEY
        sync: false
      - key: OTP_EXPIRES_IN_MINUTES
        value: "15"
